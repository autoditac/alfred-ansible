---
- name: Converge
  hosts: all
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Create a temporary render directory
      ansible.builtin.file:
        path: /tmp/alfred-ansible-molecule-default
        state: directory
        mode: "0755"

    - name: Render the security update templates
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/{{ item.src }}"
        dest: "/tmp/alfred-ansible-molecule-default/{{ item.dest }}"
        mode: "0644"
      loop:
        - src: 20auto-upgrades.j2
          dest: 20auto-upgrades
        - src: 52alfred-unattended-upgrades.j2
          dest: 52alfred-unattended-upgrades

    - name: Render the CaSSAndRA container template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/cassandra.container.j2"
        dest: /tmp/alfred-ansible-molecule-default/cassandra.container
        mode: "0644"

    - name: Copy the WiFi LED daemon
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../files/alfred-wifi-led.py"
        dest: /tmp/alfred-ansible-molecule-default/alfred-wifi-led
        mode: "0755"

    - name: Render the WiFi LED environment template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/wifi-led.env.j2"
        dest: /tmp/alfred-ansible-molecule-default/wifi-led.env
        mode: "0644"

    - name: Render the WiFi LED service template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/wifi-led.service.j2"
        dest: /tmp/alfred-ansible-molecule-default/wifi-led.service
        mode: "0644"

    - name: Render the CaSSAndRA MQTT API credential environment file
      ansible.builtin.copy:
        dest: /tmp/alfred-ansible-molecule-default/cassandra-mqtt-api.env
        mode: "0600"
        content: |
          {% if alfred_cassandra_api_mqtt_username | default('') | string | length > 0 %}
          CASSANDRA_API_MQTT_USERNAME={{ alfred_cassandra_api_mqtt_username | string }}
          {% endif %}
          {% if alfred_cassandra_api_mqtt_password | default('') | string | length > 0 %}
          CASSANDRA_API_MQTT_PASSWORD={{ alfred_cassandra_api_mqtt_password | string }}
          {% endif %}


    - name: Copy CaSSAndRA MQTT API config script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../files/cassandra-mqtt-api-config.py"
        dest: /tmp/alfred-ansible-molecule-default/cassandra-mqtt-api-config
        mode: "0755"
