- name: Verify rendered CaSSAndRA MQTT API container environment
  when: not (test_mode | default(false))
  block:
    - name: Stat rendered CaSSAndRA container unit
      ansible.builtin.stat:
        path: /tmp/alfred-ansible-molecule-default/cassandra.container
      register: cassandra_container_stat

    - name: Assert CaSSAndRA container unit exists
      ansible.builtin.assert:
        that:
          - cassandra_container_stat.stat.exists
          - cassandra_container_stat.stat.isreg

    - name: Read rendered CaSSAndRA container unit
      ansible.builtin.slurp:
        path: /tmp/alfred-ansible-molecule-default/cassandra.container
      register: cassandra_container

    - name: Assert MQTT API environment is rendered
      ansible.builtin.assert:
        that:
          - (cassandra_container.content | b64decode) is search('Environment=CASSANDRA_API="MQTT"')
          - (cassandra_container.content | b64decode) is search('Environment=CASSANDRA_API_MQTT_CLIENT_ID="cassandra-batman"')
          - (cassandra_container.content | b64decode) is search('Environment=CASSANDRA_API_MQTT_SERVER="mqtt.example.test"')
          - (cassandra_container.content | b64decode) is search("Environment=CASSANDRA_API_MQTT_PORT=1884")
          - (cassandra_container.content | b64decode) is search('Environment=CASSANDRA_API_MQTT_SERVER_NAME="batman"')
          - (cassandra_container.content | b64decode) is search("EnvironmentFile=-/tmp/alfred-ansible-molecule-default/cassandra-mqtt-api.env")
          - not ((cassandra_container.content | b64decode) is search("CASSANDRA_API_MQTT_USERNAME"))
          - not ((cassandra_container.content | b64decode) is search("CASSANDRA_API_MQTT_PASSWORD"))

    - name: Stat rendered CaSSAndRA MQTT API credential environment file
      ansible.builtin.stat:
        path: /tmp/alfred-ansible-molecule-default/cassandra-mqtt-api.env
      register: cassandra_mqtt_env_file_stat

    - name: Assert credential environment file is private
      ansible.builtin.assert:
        that:
          - cassandra_mqtt_env_file_stat.stat.exists
          - cassandra_mqtt_env_file_stat.stat.isreg
          - cassandra_mqtt_env_file_stat.stat.mode == "0600"

    - name: Read rendered CaSSAndRA MQTT API credential environment file
      ansible.builtin.slurp:
        path: /tmp/alfred-ansible-molecule-default/cassandra-mqtt-api.env
      register: cassandra_mqtt_env_file

    - name: Assert credentials are rendered only in the private environment file
      ansible.builtin.assert:
        that:
          - (cassandra_mqtt_env_file.content | b64decode) is search('CASSANDRA_API_MQTT_USERNAME="batman"')
          - (cassandra_mqtt_env_file.content | b64decode) is search('CASSANDRA_API_MQTT_PASSWORD="test-secret"')

    - name: Write sample CaSSAndRA commcfg
      ansible.builtin.copy:
        dest: /tmp/alfred-ansible-molecule-default/commcfg.json
        mode: "0644"
        content: |
          {
              "USE": "HTTP",
              "MQTT": [],
              "HTTP": [],
              "UART": [],
              "API": null,
              "MQTT_API": [
                  {"CLIENT_ID": "CaSSAndRA_api"},
                  {"USERNAME": ""},
                  {"PASSWORD": ""},
                  {"MQTT_SERVER": "192.168.1.1"},
                  {"PORT": 1883},
                  {"API_SERVER_NAME": "myCaSSAndRA"}
              ],
              "MESSAGE_SERVICE": null,
              "TELEGRAM": [],
              "PUSHOVER": []
          }

    - name: Apply sample CaSSAndRA MQTT API config
      ansible.builtin.command:
        argv:
          - /tmp/alfred-ansible-molecule-default/cassandra-mqtt-api-config
          - /tmp/alfred-ansible-molecule-default/commcfg.json
          - API=MQTT
          - CLIENT_ID=cassandra-batman
          - MQTT_SERVER=mqtt.example.test
          - PORT=1884
          - API_SERVER_NAME=batman
      environment:
        CASSANDRA_API_MQTT_USERNAME: batman
        CASSANDRA_API_MQTT_PASSWORD: test-secret
      register: cassandra_mqtt_config_result
      changed_when: cassandra_mqtt_config_result.stdout | trim == "changed"

    - name: Read patched sample CaSSAndRA commcfg
      ansible.builtin.slurp:
        path: /tmp/alfred-ansible-molecule-default/commcfg.json
      register: cassandra_commcfg

    - name: Assert sample CaSSAndRA MQTT API config was patched
      ansible.builtin.assert:
        that:
          - (cassandra_commcfg.content | b64decode | from_json).API == "MQTT"
          - (cassandra_commcfg.content | b64decode | from_json).MQTT_API[0].CLIENT_ID == "cassandra-batman"
          - (cassandra_commcfg.content | b64decode | from_json).MQTT_API[1].USERNAME == "batman"
          - (cassandra_commcfg.content | b64decode | from_json).MQTT_API[2].PASSWORD == "test-secret"
          - (cassandra_commcfg.content | b64decode | from_json).MQTT_API[3].MQTT_SERVER == "mqtt.example.test"
          - (cassandra_commcfg.content | b64decode | from_json).MQTT_API[4].PORT == 1884
          - (cassandra_commcfg.content | b64decode | from_json).MQTT_API[5].API_SERVER_NAME == "batman"

    - name: Reject invalid sample CaSSAndRA MQTT API port
      ansible.builtin.command:
        argv:
          - /tmp/alfred-ansible-molecule-default/cassandra-mqtt-api-config
          - /tmp/alfred-ansible-molecule-default/commcfg.json
          - API=MQTT
          - PORT=not-a-port
      register: cassandra_mqtt_invalid_port_result
      changed_when: false
      failed_when: false

    - name: Assert invalid MQTT API port produces a clear error
      ansible.builtin.assert:
        that:
          - cassandra_mqtt_invalid_port_result.rc == 2
          - cassandra_mqtt_invalid_port_result.stderr is search("PORT must be an integer")
