driver:
  name: delegated

platforms:
  - name: batman

provisioner:
  name: ansible
  inventory:
    host_vars:
      batman:
        ansible_connection: local
        ansible_become: false
        ansible_user: pi
        alfred_timezone: Europe/Copenhagen
        alfred_cassandra_image: ghcr.io/autoditac/cassandra
        alfred_cassandra_image_tag: latest
        alfred_cassandra_api: MQTT
        alfred_cassandra_api_mqtt_server: mqtt.example.test
        alfred_cassandra_api_mqtt_port: 1884
        alfred_cassandra_api_mqtt_username: batman
        alfred_cassandra_api_mqtt_password: test-secret
        alfred_cassandra_api_mqtt_client_id: cassandra-batman
        alfred_cassandra_api_mqtt_server_name: batman
        alfred_cassandra_api_mqtt_env_file: /tmp/alfred-ansible-molecule-default/cassandra-mqtt-api.env
        alfred_enable_security_updates: true
        alfred_packages:
          - podman
          - openocd
          - libgpiod3
        alfred_unattended_upgrades_reboot_time: "03:00"
        alfred_wifi_led_backend: panel
        alfred_wifi_led_interface: wlan0
        alfred_wifi_led_interval: 2
        alfred_wifi_led_require_default_route: true
        alfred_wifi_led_degraded_rssi_dbm: -75
        alfred_wifi_led_health_host: ""
        alfred_wifi_led_env_file: /tmp/alfred-ansible-molecule-default/wifi-led.env
        alfred_wifi_led_panel_i2c_bus: /dev/i2c-1
        alfred_wifi_led_panel_i2c_address: "0x22"
        alfred_wifi_led_panel_mux_address: "0x70"
        alfred_wifi_led_panel_mux_channel: 0
        alfred_wifi_led_panel_green_port: 0
        alfred_wifi_led_panel_green_pin: 0
        alfred_wifi_led_panel_red_port: 0
        alfred_wifi_led_panel_red_pin: 1

verifier:
  name: ansible
