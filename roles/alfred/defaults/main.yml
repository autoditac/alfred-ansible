---
# Generic hardware defaults. Override in inventory for non-RPi4 or perimeter MCU targets.
alfred_board: rpi4
alfred_mcu: main

# System packages
alfred_packages:
  - podman
  - openocd
  - libgpiod3

# Security updates
alfred_enable_security_updates: false
alfred_unattended_upgrades_reboot_time: "03:00"

# Podman image references (base registry paths; tag is set via alfred_*_image_tag below)
alfred_sunray_image: ghcr.io/autoditac/sunray
alfred_dashboard_image: ghcr.io/autoditac/alfred-dashboard
alfred_cassandra_image: ghcr.io/autoditac/cassandra

# Release stream tags (overridable per host in inventory)
# Streams: latest (production default) | beta (batman test stream) | alpha (feature testing)
alfred_sunray_image_tag: latest
alfred_dashboard_image_tag: latest
alfred_cassandra_image_tag: latest
alfred_safe_update_on_calendar: "*-*-* 03:00:00"

# Observability profile. By default, derive host logging behavior from the
# configured Sunray stream: alpha/beta keep diagnostic retention; latest keeps
# logs in volatile storage and avoids debug-level retention. Override
# alfred_observability_stream or the journald variables per host if needed.
alfred_observability_stream: "{{ alfred_sunray_image_tag | default('latest') | string }}"
alfred_observability_persistent_streams:
  - alpha
  - beta

# Optional CaSSAndRA MQTT API for CaSSAndRA Native. Leave alfred_cassandra_api
# empty to keep the API disabled; set it to MQTT and provide a broker to enable.
alfred_cassandra_api: ""
alfred_cassandra_api_mqtt_server: ""
alfred_cassandra_api_mqtt_port: 1883
alfred_cassandra_api_mqtt_username: ""
alfred_cassandra_api_mqtt_password: ""
alfred_cassandra_api_mqtt_client_id: ""
alfred_cassandra_api_mqtt_server_name: ""
alfred_cassandra_api_mqtt_env_file: /etc/alfred/cassandra-mqtt-api.env

# Timezone applied to all alfred containers (cassandra, sunray, alfred-dashboard).
# Override per host in inventory if needed.
alfred_timezone: Europe/Copenhagen

# Paths
alfred_mcu_dir: /home/{{ ansible_user }}/alfred-mcu
alfred_quadlet_dir: /etc/containers/systemd

# SWD GPIO mapping per board type
alfred_swd_gpio:
  rpi4:
    swdio: 24
    swclk: 25
    srst_main: 23
    srst_peri: 20
    chip: 0
    driver: linuxgpiod
  bananapi:
    swdio: 10
    swclk: 47
    srst_main: 11
    srst_peri: 20
    chip: 0
    driver: sysfsgpio

# OS tuning
alfred_vm_swappiness: 10
alfred_wifi_regdomain: DK
alfred_wifi_band: bg
alfred_wifi_connection: preconfigured

# WiFi status LED. The panel backend drives the external mower LED 1 via the
# PCA9555 panel expander. The ACT backend is a single-color fallback with blink
# patterns. Set backend to disabled to stop deploying the service.
alfred_wifi_led_enabled: true
alfred_wifi_led_backend: panel
alfred_wifi_led_interface: wlan0
alfred_wifi_led_interval: 2
alfred_wifi_led_require_default_route: true
alfred_wifi_led_degraded_rssi_dbm: -75
alfred_wifi_led_health_host: ""
alfred_wifi_led_act_led: /sys/class/leds/ACT
alfred_wifi_led_env_file: /etc/default/wifi-led
alfred_wifi_led_panel_i2c_bus: /dev/i2c-1
alfred_wifi_led_panel_i2c_address: "0x22"
alfred_wifi_led_panel_mux_address: "0x70"
alfred_wifi_led_panel_mux_channel: 0
alfred_wifi_led_panel_green_port: 0
alfred_wifi_led_panel_green_pin: 0
alfred_wifi_led_panel_red_port: 0
alfred_wifi_led_panel_red_pin: 1

# Journald logging
alfred_journald_config_dir: /etc/systemd/journald.conf.d
alfred_journald_storage_dir: /var/log/journal
alfred_journald_storage: "{{ 'persistent' if alfred_observability_stream in alfred_observability_persistent_streams else 'volatile' }}"
alfred_journald_max_level_store: "{{ 'debug' if alfred_observability_stream in alfred_observability_persistent_streams else 'info' }}"
alfred_journald_system_max_use: 500M
alfred_journald_system_keep_free: 50M
alfred_journald_system_max_file_size: 100M
alfred_journald_runtime_max_use: 64M

alfred_boot_config_lines:
  - usb_max_current_enable=1
  - dtparam=uart0=on
  - enable_uart=1
  - dtparam=i2c_arm=on

# Equivalent to raspi-config's serial settings for the mower:
# keep the UART hardware enabled, but do not run a Linux login console on it.
alfred_serial_login_enabled: false
alfred_serial_console_kernel_regex: '^console=(serial0|ttyS0|ttyAMA0),'
alfred_serial_getty_units:
  - serial-getty@serial0.service
  - serial-getty@ttyS0.service

# MCU firmware binary (set via --extra-vars or leave empty to skip flash)
alfred_firmware_bin: ""

# u-blox F9P GPS receiver
# Firmware updates reset the receiver configuration. Keep the Sunray-required
# receiver profile here so `--tags gps` can reapply it to RAM | BBR | FLASH
# (layers byte 0x07) after an update or module reset.
alfred_f9p_device: /dev/ttyACM0
alfred_f9p_uart1_baudrate: 115200
alfred_f9p_uart2_baudrate: 115200
alfred_f9p_state_dir: /var/lib/alfred
alfred_f9p_config_layers: 7

# u-blox F9P firmware update tooling. Firmware flashing is never part of a
# normal deploy; it only runs with the explicit f9p-flash tag and confirmation.
alfred_f9p_tool_dir: /opt/alfred/ublox_f9p
alfred_f9p_expected_firmware: HPG 1.51
alfred_f9p_default_firmware_file: UBX_F9_100_HPG151_ZED_F9P.6c43b30ccfed539322eccedfb96ad933.bin
alfred_f9p_firmware_file: "{{ alfred_f9p_default_firmware_file }}"
alfred_f9p_firmware_sha256: f1ba0e4eb7c79fd15a04c7d9033fc58d89aec77335f7e7cdf7e6669280803831
alfred_f9p_firmware_size: 1354632
alfred_f9p_probe_baud: 9600
alfred_f9p_flash_baud: "9600:9600:115200"
alfred_f9p_verbose: 1
alfred_f9p_flash_confirm: false
alfred_f9p_flash_dry_run: true
alfred_f9p_allow_non_batman: false
alfred_f9p_allow_unexpected_firmware: false
alfred_f9p_process_pattern: /opt/sunray/sunray

alfred_f9p_config:
  # Keep hardware interfaces in the same state Sunray used to configure at
  # startup. Sunray now only consumes the receiver data stream.
  - key: CFG-UART1-ENABLED
    value: 1
  - key: CFG-UART2-ENABLED
    value: 1
  - key: CFG-I2C-ENABLED
    value: 0
  - key: CFG-USB-ENABLED
    value: 1

  # UART1 is the Ardumower receiver data path kept for compatibility.
  - key: CFG-UART1-BAUDRATE
    value: "{{ alfred_f9p_uart1_baudrate }}"
  - key: CFG-UART1INPROT-UBX
    value: 1
  - key: CFG-UART1INPROT-NMEA
    value: 0
  - key: CFG-UART1INPROT-RTCM3X
    value: 0
  - key: CFG-UART1OUTPROT-UBX
    value: 1
  - key: CFG-UART1OUTPROT-NMEA
    value: 0
  - key: CFG-UART1OUTPROT-RTCM3X
    value: 0

  # UART2 is the RTCM3 correction input path.
  - key: CFG-UART2-BAUDRATE
    value: "{{ alfred_f9p_uart2_baudrate }}"
  - key: CFG-UART2INPROT-UBX
    value: 0
  - key: CFG-UART2INPROT-NMEA
    value: 0
  - key: CFG-UART2INPROT-RTCM3X
    value: 1
  - key: CFG-UART2OUTPROT-UBX
    value: 0
  - key: CFG-UART2OUTPROT-NMEA
    value: 1
  - key: CFG-UART2OUTPROT-RTCM3X
    value: 0

  # USB is the Sunray receiver data path. RTCM3 over USB stays disabled because
  # corrections arrive through the receiver's external correction path.
  - key: CFG-USBINPROT-UBX
    value: 1
  - key: CFG-USBINPROT-NMEA
    value: 1
  - key: CFG-USBINPROT-RTCM3X
    value: 0
  - key: CFG-USBOUTPROT-UBX
    value: 1
  - key: CFG-USBOUTPROT-NMEA
    value: 0
  - key: CFG-USBOUTPROT-RTCM3X
    value: 0

  # Sunray expects 5 Hz navigation updates and a 60 s DGNSS timeout.
  - key: CFG-NAVSPG-FIXMODE
    value: 3
  - key: CFG-NAVSPG-INIFIX3D
    value: 0
  - key: CFG-NAVSPG-CONSTR_ALT
    value: 10000
  - key: CFG-RATE-MEAS
    value: 200
  - key: CFG-RATE-NAV
    value: 1
  - key: CFG-NAVSPG-INFIL_MINELEV
    value: 10
  - key: CFG-NAVSPG-INFIL_NCNOTHRS
    value: 0
  - key: CFG-NAVSPG-INFIL_CNOTHRS
    value: 0
  - key: CFG-NAVSPG-CONSTR_DGNSSTO
    value: 60

  # USB is the Sunray receiver data path.
  - key: CFG-MSGOUT-UBX_NAV_RELPOSNED_USB
    value: 1
  - key: CFG-MSGOUT-UBX_NAV_HPPOSLLH_USB
    value: 1
  - key: CFG-MSGOUT-UBX_NAV_VELNED_USB
    value: 1
  - key: CFG-MSGOUT-UBX_RXM_RTCM_USB
    value: 5
  - key: CFG-MSGOUT-UBX_NAV_SIG_USB
    value: 20
  - key: CFG-MSGOUT-NMEA_ID_GGA_USB
    value: 60
  - key: CFG-MSGOUT-UBX_MON_COMMS_USB
    value: 70
  - key: CFG-MSGOUT-UBX_NAV_PVT_USB
    value: 0
  - key: CFG-MSGOUT-UBX_NAV_TIMEUTC_USB
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GSA_USB
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GLL_USB
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GSV_USB
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_RMC_USB
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_VTG_USB
    value: 0

  # UART1 mirrors the Sunray rover stream for boards that consume the receiver
  # through the Ardumower serial path.
  - key: CFG-MSGOUT-UBX_NAV_RELPOSNED_UART1
    value: 1
  - key: CFG-MSGOUT-UBX_NAV_HPPOSLLH_UART1
    value: 1
  - key: CFG-MSGOUT-UBX_NAV_VELNED_UART1
    value: 1
  - key: CFG-MSGOUT-UBX_RXM_RTCM_UART1
    value: 5
  - key: CFG-MSGOUT-UBX_NAV_SIG_UART1
    value: 20
  - key: CFG-MSGOUT-UBX_NAV_PVT_UART1
    value: 0
  - key: CFG-MSGOUT-UBX_NAV_TIMEUTC_UART1
    value: 0

  # UART2 emits only an occasional GGA sentence while accepting RTCM3 input.
  - key: CFG-MSGOUT-NMEA_ID_GGA_UART2
    value: 60
  - key: CFG-MSGOUT-NMEA_ID_DTM_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GBS_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GLL_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GNS_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GRS_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GSA_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GST_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_GSV_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_RMC_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_VLW_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_VTG_UART2
    value: 0
  - key: CFG-MSGOUT-NMEA_ID_ZDA_UART2
    value: 0

# CaSSAndRA defaults (fix stock template values)
# Stock CaSSAndRA ships with HTTP IP=http://192.168.1.1 and PASSWORD=null,
# which does not match the Sunray container running on the same host. We fix
# only when those exact stock values are still present (UI changes preserved).
alfred_sunray_http_ip: "http://127.0.0.1"
alfred_sunray_http_password: "123456"   # matches default PASS in sunray/config.h
alfred_cassandra_rover_picture: "alfred/"  # UI avatar / robot image directory name
