---
- name: Install system packages
  ansible.builtin.apt:
    name: "{{ alfred_packages }}"
    state: present
    update_cache: true
  tags: [packages]


# --- Security updates ---

- name: Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
  when: alfred_enable_security_updates | bool
  tags: [packages, security]

- name: Ensure APT daily timers are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  when: alfred_enable_security_updates | bool
  tags: [packages, security]

- name: Deploy APT periodic auto-upgrades config
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  when: alfred_enable_security_updates | bool
  tags: [packages, security]

- name: Deploy unattended-upgrades reboot window config
  ansible.builtin.template:
    src: 52alfred-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52alfred-unattended-upgrades
    mode: "0644"
  when: alfred_enable_security_updates | bool
  tags: [packages, security]

# --- OS tuning ---

- name: Deploy CPU performance governor service
  ansible.builtin.copy:
    src: cpu-performance.service
    dest: /etc/systemd/system/cpu-performance.service
    mode: "0644"
  notify: Reload systemd
  tags: [tuning]

- name: Enable CPU performance governor service
  ansible.builtin.systemd:
    name: cpu-performance.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [tuning]

- name: Set vm.swappiness via sysctl
  ansible.builtin.copy:
    content: "vm.swappiness={{ alfred_vm_swappiness }}\n"
    dest: /etc/sysctl.d/99-sunray.conf
    mode: "0644"
  notify: Reload sysctl
  tags: [tuning]


- name: Create journald config directory
  ansible.builtin.file:
    path: "{{ alfred_journald_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [tuning, logging]

- name: Create persistent journal storage directory
  ansible.builtin.file:
    path: "{{ alfred_journald_storage_dir }}"
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  tags: [tuning, logging]

- name: Deploy persistent journald configuration
  ansible.builtin.template:
    src: journald.conf.j2
    dest: "{{ alfred_journald_config_dir }}/10-persistent.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald
  tags: [tuning, logging]

- name: Ensure boot config lines are present
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "{{ item }}"
    state: present
  loop: "{{ alfred_boot_config_lines }}"
  tags: [tuning]

- name: Read kernel command line
  ansible.builtin.slurp:
    src: /boot/firmware/cmdline.txt
  register: alfred_kernel_cmdline
  when: not alfred_serial_login_enabled | bool
  tags: [tuning, serial]

- name: Remove serial login console from kernel command line
  ansible.builtin.copy:
    content: "{{ ((alfred_kernel_cmdline.content | b64decode).split() | reject('match', alfred_serial_console_kernel_regex) | join(' ')) ~ '\n' }}"
    dest: /boot/firmware/cmdline.txt
  when: not alfred_serial_login_enabled | bool
  tags: [tuning, serial]

- name: Stop and disable serial getty on MCU UART
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ alfred_serial_getty_units }}"
  when: not alfred_serial_login_enabled | bool
  tags: [tuning, serial]

- name: Ensure i2c_dev module is loaded at boot
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: i2c_dev
    state: present
  tags: [tuning]


- name: Disable WiFi power save via NetworkManager
  ansible.builtin.copy:
    content: |
      [connection]
      wifi.powersave = 2
    dest: /etc/NetworkManager/conf.d/wifi-powersave.conf
    mode: "0644"
  notify: Restart NetworkManager
  tags: [tuning]

- name: Set WiFi band preference
  ansible.builtin.command:
    argv:
      - nmcli
      - con
      - modify
      - "{{ alfred_wifi_connection }}"
      - 802-11-wireless.band
      - "{{ alfred_wifi_band }}"
  changed_when: true
  notify: Restart NetworkManager
  tags: [tuning]

- name: Set WiFi regulatory domain in kernel cmdline
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: 'cfg80211\.ieee80211_regdom=\S+'
    replace: "cfg80211.ieee80211_regdom={{ alfred_wifi_regdomain }}"
  tags: [tuning]

- name: Deploy WiFi LED indicator service
  ansible.builtin.copy:
    src: wifi-led.service
    dest: /etc/systemd/system/wifi-led.service
    mode: "0644"
  notify: Reload systemd
  tags: [tuning]

- name: Enable WiFi LED indicator service
  ansible.builtin.systemd:
    name: wifi-led.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [tuning]

# --- OpenOCD / MCU ---

- name: Create MCU directory
  ansible.builtin.file:
    path: "{{ alfred_mcu_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [openocd, firmware]

- name: Deploy OpenOCD configs
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ alfred_mcu_dir }}/{{ item | replace('.j2', '') }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - swd-pi.ocd.j2
    - flash.ocd.j2
    - save-firmware.ocd.j2
  tags: [openocd]

- name: Ensure Alfred private config directory exists
  ansible.builtin.file:
    path: "{{ alfred_cassandra_api_mqtt_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: alfred_cassandra_api | default('') | string == 'MQTT'
  tags: [services, cassandra]

- name: Deploy CaSSAndRA MQTT API credential environment file
  ansible.builtin.copy:
    dest: "{{ alfred_cassandra_api_mqtt_env_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      {% if alfred_cassandra_api_mqtt_username | default('') | string | length > 0 %}
      CASSANDRA_API_MQTT_USERNAME={{ alfred_cassandra_api_mqtt_username | string }}
      {% endif %}
      {% if alfred_cassandra_api_mqtt_password | default('') | string | length > 0 %}
      CASSANDRA_API_MQTT_PASSWORD={{ alfred_cassandra_api_mqtt_password | string }}
      {% endif %}
  when: alfred_cassandra_api | default('') | string == 'MQTT'
  no_log: true  # MQTT credentials are sensitive
  notify: Restart cassandra
  tags: [services, cassandra]

- name: Deploy templated CaSSAndRA Quadlet
  ansible.builtin.template:
    src: cassandra.container.j2
    dest: "{{ alfred_quadlet_dir }}/cassandra.container"
    mode: "0644"
  notify: Reload systemd
  tags: [services]

- name: Deploy templated Alfred Dashboard Quadlet
  ansible.builtin.template:
    src: alfred-dashboard.container.j2
    dest: "{{ alfred_quadlet_dir }}/alfred-dashboard.container"
    mode: "0644"
  notify: Reload systemd
  tags: [services]

- name: Deploy templated Sunray Quadlet
  ansible.builtin.template:
    src: sunray.container.j2
    dest: "{{ alfred_quadlet_dir }}/sunray.container"
    mode: "0644"
  notify: Reload systemd
  tags: [services]

- name: Create CaSSAndRA data directory
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.cassandra
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [services]

- name: Ensure all services are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - sunray.service
    - cassandra.service
    - alfred-dashboard.service
  tags: [services]

- name: Start all services (best-effort; images may not be available yet)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - sunray.service
    - cassandra.service
    - alfred-dashboard.service
  register: alfred_service_start_results
  failed_when: false
  tags: [services]

- name: Fail on unexpected service start errors
  ansible.builtin.fail:
    msg: "Failed to start {{ item.item }}: {{ item.msg | default('unknown error') }}"
  loop: "{{ alfred_service_start_results.results | default([]) }}"
  when:
    - item.failed | default(false)
    - item.msg is not search('(?i)(no such image|manifest unknown|pull access denied|image.*not found|Unit.*not found)')
  tags: [services]

- name: Deploy alfred-safe-update script
  ansible.builtin.copy:
    src: alfred-safe-update.sh
    dest: /usr/local/bin/alfred-safe-update
    mode: "0755"
  tags: [services]

- name: Deploy alfred-safe-update systemd units
  ansible.builtin.copy:
    src: alfred-safe-update.service
    dest: /etc/systemd/system/alfred-safe-update.service
    mode: "0644"
  notify: Reload systemd
  tags: [services]

- name: Deploy templated alfred-safe-update timer
  ansible.builtin.template:
    src: alfred-safe-update.timer.j2
    dest: /etc/systemd/system/alfred-safe-update.timer
    mode: "0644"
  notify: Reload systemd
  tags: [services]

- name: Disable default podman auto-update timer
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    enabled: false
    state: stopped
  failed_when: false
  tags: [services]

- name: Enable alfred-safe-update timer
  ansible.builtin.systemd:
    name: alfred-safe-update.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [services]

# MCU firmware flash (optional — only when binary is provided)
- name: Copy firmware binary
  ansible.builtin.copy:
    src: "{{ alfred_firmware_bin }}"
    dest: "{{ alfred_mcu_dir }}/rm18.ino.bin"
    mode: "0644"
  when: alfred_firmware_bin | length > 0
  tags: [firmware]

- name: Backup current MCU firmware
  ansible.builtin.command:
    cmd: >-
      openocd
      -f {{ alfred_mcu_dir }}/swd-pi.ocd
      -f {{ alfred_mcu_dir }}/save-firmware.ocd
  when: alfred_firmware_bin | length > 0
  tags: [firmware]

- name: Stop sunray for MCU flash
  ansible.builtin.systemd:
    name: sunray.service
    state: stopped
  when: alfred_firmware_bin | length > 0
  tags: [firmware]

- name: Flash MCU firmware
  ansible.builtin.command:
    cmd: >-
      openocd
      -f {{ alfred_mcu_dir }}/swd-pi.ocd
      -f {{ alfred_mcu_dir }}/flash.ocd
  when: alfred_firmware_bin | length > 0
  tags: [firmware]

- name: Start sunray after MCU flash
  ansible.builtin.systemd:
    name: sunray.service
    state: started
  when: alfred_firmware_bin | length > 0
  tags: [firmware]

# --- u-blox F9P GPS persistent configuration and firmware maintenance ---

- name: Include u-blox F9P receiver tasks
  ansible.builtin.import_tasks: f9p.yml

# --- CaSSAndRA HTTP defaults ---
# Stock CaSSAndRA ships with IP=http://192.168.1.1 and PASSWORD=null in the HTTP
# block. Replace only those exact stock values with the Sunray container's
# loopback URL and the firmware's default PASS so the dashboard works on first
# boot. Any value that has been changed via the CaSSAndRA UI is preserved.

- name: Deploy CaSSAndRA commcfg fixer script
  ansible.builtin.copy:
    src: cassandra-json-fix.py
    dest: /usr/local/bin/cassandra-json-fix
    owner: root
    group: root
    mode: "0755"
  tags: [services, cassandra]

- name: Deploy CaSSAndRA MQTT API config script
  ansible.builtin.copy:
    src: cassandra-mqtt-api-config.py
    dest: /usr/local/bin/cassandra-mqtt-api-config
    owner: root
    group: root
    mode: "0755"
  tags: [services, cassandra]

- name: Check whether CaSSAndRA commcfg.json exists
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.cassandra/user/commcfg.json"
  register: alfred_cassandra_commcfg
  tags: [services, cassandra]

- name: Apply Sunray HTTP defaults to CaSSAndRA commcfg.json (idempotent)
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cassandra-json-fix
      - "/home/{{ ansible_user }}/.cassandra/user/commcfg.json"
      - "http://192.168.1.1"
      - "IP={{ alfred_sunray_http_ip }}"
      - "PASSWORD={{ alfred_sunray_http_password }}"
  register: alfred_cassandra_fix
  changed_when: alfred_cassandra_fix.stdout | trim == "changed"
  when: alfred_cassandra_commcfg.stat.exists | default(false)
  no_log: true  # alfred_sunray_http_password is sensitive
  notify: Restart cassandra
  tags: [services, cassandra]

- name: Validate CaSSAndRA MQTT API broker configuration
  ansible.builtin.assert:
    that:
      - (alfred_cassandra_api | default('') | string) in ['', 'MQTT']
      - (alfred_cassandra_api | default('') | string) != 'MQTT' or (alfred_cassandra_api_mqtt_server | default('') | string | trim | length > 0)
      - (alfred_cassandra_api | default('') | string) != 'MQTT' or (alfred_cassandra_api_mqtt_port | string is match('^[0-9]+$'))
      - (alfred_cassandra_api | default('') | string) != 'MQTT' or (alfred_cassandra_api_mqtt_port | int >= 1 and alfred_cassandra_api_mqtt_port | int <= 65535)
    fail_msg: alfred_cassandra_api must be empty or MQTT; MQTT requires a non-empty broker server and TCP port 1-65535.
  tags: [services, cassandra]

- name: Apply CaSSAndRA MQTT API config to commcfg.json (idempotent)
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cassandra-mqtt-api-config
      - "/home/{{ ansible_user }}/.cassandra/user/commcfg.json"
      - "API={{ alfred_cassandra_api }}"
      - "CLIENT_ID={{ alfred_cassandra_api_mqtt_client_id | default('') or 'cassandra-' ~ inventory_hostname }}"
      - "MQTT_SERVER={{ alfred_cassandra_api_mqtt_server }}"
      - "PORT={{ alfred_cassandra_api_mqtt_port }}"
      - "API_SERVER_NAME={{ alfred_cassandra_api_mqtt_server_name | default('') or inventory_hostname }}"
  environment:
    CASSANDRA_API_MQTT_USERNAME: "{{ alfred_cassandra_api_mqtt_username }}"
    CASSANDRA_API_MQTT_PASSWORD: "{{ alfred_cassandra_api_mqtt_password }}"
  register: alfred_cassandra_mqtt_api_fix
  changed_when: alfred_cassandra_mqtt_api_fix.stdout | trim == "changed"
  when:
    - alfred_cassandra_commcfg.stat.exists | default(false)
    - alfred_cassandra_api | default('') | string == 'MQTT'
  no_log: true  # MQTT credentials are sensitive
  notify: Restart cassandra
  tags: [services, cassandra]

- name: Check whether CaSSAndRA appcfg.json exists
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.cassandra/user/appcfg.json"
  register: alfred_cassandra_appcfg
  tags: [services, cassandra]

- name: Set rover_picture to alfred in CaSSAndRA appcfg.json (idempotent)
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cassandra-json-fix
      - "/home/{{ ansible_user }}/.cassandra/user/appcfg.json"
      - "ardumower/"
      - "rover_picture={{ alfred_cassandra_rover_picture }}"
  register: alfred_cassandra_appcfg_fix
  changed_when: alfred_cassandra_appcfg_fix.stdout | trim == "changed"
  when: alfred_cassandra_appcfg.stat.exists | default(false)
  notify: Restart cassandra
  tags: [services, cassandra]
