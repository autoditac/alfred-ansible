# --- u-blox F9P GPS persistent configuration ---
# u-blox firmware updates clear receiver configuration. Reapply the profile
# to RAM | BBR | FLASH so Sunray sees the expected USB messages and UART2
# continues accepting RTCM3 corrections after module resets or firmware work.

- name: Install gpsd (provides ubxtool for F9P configuration)
  ansible.builtin.apt:
    name: gpsd
    state: present
  tags: [packages, gps, f9p-preflight, f9p-flash]

- name: Mask gpsd daemon (Sunray talks to F9P directly via USB)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop:
    - gpsd.service
    - gpsd.socket
  failed_when: false
  tags: [gps, f9p-preflight, f9p-flash]

- name: Ensure alfred state directory exists
  ansible.builtin.file:
    path: "{{ alfred_f9p_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [gps, f9p-preflight, f9p-flash]

- name: Persist F9P receiver configuration to RAM | BBR | FLASH
  # Wrap in block/always so sunray is always restarted, even if ubxtool fails
  # or is missing - we never want to leave the rover with sunray stopped.
  block:
    - name: Stop sunray before configuring F9P receiver
      ansible.builtin.systemd:
        name: sunray.service
        state: stopped
      register: alfred_f9p_sunray_stop
      changed_when: false

    - name: Wait for sunray to release the F9P device
      ansible.builtin.pause:
        seconds: 2
      when: alfred_f9p_sunray_stop is succeeded

    - name: Write F9P receiver configuration to RAM | BBR | FLASH
      ansible.builtin.command:
        argv:
          - ubxtool
          - -f
          - "{{ alfred_f9p_device }}"
          - -s
          - "{{ alfred_f9p_uart2_baudrate }}"
          - -w
          - "1"
          - -z
          - "{{ item.key }},{{ item.value }},{{ item.layers | default(alfred_f9p_config_layers) }}"
      loop: "{{ alfred_f9p_config }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      register: alfred_f9p_config_write
      changed_when: false
      failed_when:
        - alfred_f9p_config_write.rc != 0
        - "'UBX-ACK-ACK' not in alfred_f9p_config_write.stdout"
  always:
    - name: Ensure sunray is started after configuring F9P receiver
      ansible.builtin.systemd:
        name: sunray.service
        state: started
      changed_when: false
  tags: [gps]

- name: Record F9P receiver configuration profile
  ansible.builtin.copy:
    dest: "{{ alfred_f9p_state_dir }}/f9p-config-profile.txt"
    content: |
      # Generated by alfred-ansible
      # Device: {{ alfred_f9p_device }}
      # Layers: {{ alfred_f9p_config_layers }} (RAM | BBR | FLASH)
      {% for item in alfred_f9p_config %}
      {{ item.key }}={{ item.value }} layer={{ item.layers | default(alfred_f9p_config_layers) }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  tags: [gps]

# --- u-blox F9P firmware maintenance tooling ---
# All firmware maintenance tasks carry the `never` tag. They run only when the
# operator explicitly requests `--tags f9p-preflight` or `--tags f9p-flash`.

- name: Ensure u-blox F9P tool directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ alfred_f9p_tool_dir }}"
    - "{{ alfred_f9p_tool_dir }}/firmwares"
  tags: [never, f9p-preflight, f9p-flash]

- name: Deploy u-blox F9P updater tools
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ alfred_f9p_tool_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: ublox_f9p/ubxfwupdate.py
      dest: ubxfwupdate.py
      mode: "0755"
    - src: ublox_f9p/ubxconfig.py
      dest: ubxconfig.py
      mode: "0755"
    - src: ublox_f9p/readme.txt
      dest: README-upstream.txt
      mode: "0644"
  tags: [never, f9p-preflight, f9p-flash]

- name: Deploy selected u-blox F9P firmware image
  ansible.builtin.copy:
    src: "ublox_f9p/firmwares/{{ alfred_f9p_firmware_file }}"
    dest: "{{ alfred_f9p_tool_dir }}/firmwares/{{ alfred_f9p_firmware_file }}"
    owner: root
    group: root
    mode: "0644"
  tags: [never, f9p-preflight, f9p-flash]

- name: Inspect selected u-blox F9P firmware image
  ansible.builtin.stat:
    path: "{{ alfred_f9p_tool_dir }}/firmwares/{{ alfred_f9p_firmware_file }}"
    checksum_algorithm: sha256
  register: alfred_f9p_firmware_stat
  tags: [never, f9p-preflight, f9p-flash]

- name: Verify selected u-blox F9P firmware image
  ansible.builtin.assert:
    that:
      - alfred_f9p_firmware_stat.stat.exists | bool
      - alfred_f9p_firmware_stat.stat.size == alfred_f9p_firmware_size
      - alfred_f9p_firmware_stat.stat.checksum == alfred_f9p_firmware_sha256
      - alfred_f9p_firmware_file == alfred_f9p_default_firmware_file or alfred_f9p_allow_unexpected_firmware | bool
    fail_msg: >-
      Selected F9P firmware does not match the configured {{ alfred_f9p_expected_firmware }}
      baseline. Check filename, size, sha256, or set alfred_f9p_allow_unexpected_firmware=true deliberately.
  tags: [never, f9p-preflight, f9p-flash]

- name: Verify Python is available for u-blox updater
  ansible.builtin.command:
    argv:
      - python3
      - --version
  register: alfred_f9p_python_version
  changed_when: false
  tags: [never, f9p-preflight, f9p-flash]

- name: Inspect configured u-blox F9P device path
  ansible.builtin.stat:
    path: "{{ alfred_f9p_device }}"
    follow: true
  register: alfred_f9p_device_stat
  tags: [never, f9p-preflight, f9p-flash]

- name: Verify configured u-blox F9P device path exists
  ansible.builtin.assert:
    that:
      - alfred_f9p_device_stat.stat.exists | bool
    fail_msg: >-
      u-blox F9P device {{ alfred_f9p_device }} is not present. Prefer a stable
      /dev/serial/by-id/u-blox path when available.
  tags: [never, f9p-preflight, f9p-flash]

- name: Check gpsd active state before u-blox maintenance
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - gpsd.service
      - gpsd.socket
      - --property=ActiveState
      - --value
  register: alfred_f9p_gpsd_active_state
  changed_when: false
  failed_when: false
  tags: [never, f9p-preflight, f9p-flash]

- name: Verify gpsd is not holding the u-blox receiver
  ansible.builtin.assert:
    that:
      - "'active' not in alfred_f9p_gpsd_active_state.stdout_lines"
    fail_msg: gpsd is active and may hold the u-blox receiver. Run the gps tag first to mask gpsd.
  tags: [never, f9p-preflight, f9p-flash]

- name: Confirm u-blox F9P firmware flash was explicitly requested
  ansible.builtin.assert:
    that:
      - alfred_f9p_flash_confirm | bool
      - not ansible_check_mode
      - inventory_hostname == 'batman' or alfred_f9p_allow_non_batman | bool
    fail_msg: >-
      F9P firmware flashing is disabled unless alfred_f9p_flash_confirm=true is set.
      The first supported target is batman; set alfred_f9p_allow_non_batman=true only deliberately.
  tags: [never, f9p-flash]

- name: Probe u-blox F9P receiver before firmware maintenance
  block:
    - name: Stop sunray before probing F9P receiver
      ansible.builtin.systemd:
        name: sunray.service
        state: stopped
      changed_when: false

    - name: Wait for sunray to release the F9P receiver
      ansible.builtin.pause:
        seconds: 2

    - name: Check for lingering sunray process before F9P probe
      ansible.builtin.command:
        argv:
          - pgrep
          - -fa
          - "{{ alfred_f9p_process_pattern }}"
      register: alfred_f9p_lingering_sunray_probe
      changed_when: false
      failed_when: false

    - name: Verify no lingering sunray process before F9P probe
      ansible.builtin.assert:
        that:
          - alfred_f9p_lingering_sunray_probe.stdout | trim == ""
        fail_msg: "Sunray is still running and may hold {{ alfred_f9p_device }}: {{ alfred_f9p_lingering_sunray_probe.stdout }}"

    - name: Run u-blox F9P firmware probe
      ansible.builtin.command:
        argv:
          - python3
          - "{{ alfred_f9p_tool_dir }}/ubxfwupdate.py"
          - --probe
          - -p
          - "{{ alfred_f9p_device }}"
          - -b
          - "{{ alfred_f9p_probe_baud | string }}"
          - -v
          - "{{ alfred_f9p_verbose | string }}"
      register: alfred_f9p_probe
      changed_when: false

    - name: Mark F9P probe ready for firmware flash
      ansible.builtin.set_fact:
        alfred_f9p_probe_ready_for_flash: true
  always:
    - name: Ensure sunray is started after F9P firmware probe
      ansible.builtin.systemd:
        name: sunray.service
        state: started
      changed_when: false
      when: >-
        'f9p-flash' not in ansible_run_tags
        or not (alfred_f9p_probe_ready_for_flash | default(false) | bool)
  tags: [never, f9p-preflight, f9p-flash]

- name: Record u-blox F9P preflight probe output
  ansible.builtin.copy:
    dest: "{{ alfred_f9p_state_dir }}/f9p-firmware-preflight.txt"
    content: |
      # Generated by alfred-ansible
      # Device: {{ alfred_f9p_device }}
      # Expected firmware: {{ alfred_f9p_expected_firmware }}
      # Python: {{ alfred_f9p_python_version.stdout | default('unknown') }}
      {{ alfred_f9p_probe.stdout | default('') }}
      {{ alfred_f9p_probe.stderr | default('') }}
    owner: root
    group: root
    mode: "0644"
  when: alfred_f9p_probe is defined
  tags: [never, f9p-preflight, f9p-flash]

- name: Flash u-blox F9P firmware image
  block:
    - name: Stop sunray before F9P firmware flash
      ansible.builtin.systemd:
        name: sunray.service
        state: stopped
      changed_when: false

    - name: Wait for sunray to release the F9P receiver before flash
      ansible.builtin.pause:
        seconds: 2

    - name: Check for lingering sunray process before F9P flash
      ansible.builtin.command:
        argv:
          - pgrep
          - -fa
          - "{{ alfred_f9p_process_pattern }}"
      register: alfred_f9p_lingering_sunray_flash
      changed_when: false
      failed_when: false

    - name: Verify no lingering sunray process before F9P flash
      ansible.builtin.assert:
        that:
          - alfred_f9p_lingering_sunray_flash.stdout | trim == ""
        fail_msg: "Sunray is still running and may hold {{ alfred_f9p_device }}: {{ alfred_f9p_lingering_sunray_flash.stdout }}"

    - name: Run u-blox F9P firmware updater
      ansible.builtin.command:
        cmd: >-
          python3 {{ alfred_f9p_tool_dir }}/ubxfwupdate.py
          {{ alfred_f9p_tool_dir }}/firmwares/{{ alfred_f9p_firmware_file }}
          -p {{ alfred_f9p_device }}
          -b {{ alfred_f9p_flash_baud }}
          -v {{ alfred_f9p_verbose }}
          --no-fis 1
          -C 1
          -s 1
          -t 1
          {% if alfred_f9p_flash_dry_run | bool %}--dry-run{% endif %}
      register: alfred_f9p_flash_result
      changed_when: not (alfred_f9p_flash_dry_run | bool)

    - name: Wait for u-blox F9P USB device after firmware updater
      ansible.builtin.wait_for:
        path: "{{ alfred_f9p_device }}"
        timeout: 30
      when: not (alfred_f9p_flash_dry_run | bool)

    - name: Probe u-blox F9P receiver after firmware updater
      ansible.builtin.command:
        argv:
          - python3
          - "{{ alfred_f9p_tool_dir }}/ubxfwupdate.py"
          - --probe
          - -p
          - "{{ alfred_f9p_device }}"
          - -b
          - "{{ alfred_f9p_probe_baud | string }}"
          - -v
          - "{{ alfred_f9p_verbose | string }}"
      register: alfred_f9p_post_flash_probe
      changed_when: false
      retries: 10
      delay: 2
      until: alfred_f9p_post_flash_probe.rc == 0

    - name: Verify u-blox F9P firmware after firmware updater
      ansible.builtin.assert:
        that:
          - "('FWVER=' ~ alfred_f9p_expected_firmware) in alfred_f9p_post_flash_probe.stdout"
        fail_msg: >-
          F9P post-flash probe did not report FWVER={{ alfred_f9p_expected_firmware }}.
          Check {{ alfred_f9p_state_dir }}/f9p-firmware-flash.txt before retrying.
      when: not (alfred_f9p_flash_dry_run | bool)
  always:
    - name: Ensure sunray is started after F9P firmware flash
      ansible.builtin.systemd:
        name: sunray.service
        state: started
      changed_when: false
  tags: [never, f9p-flash]

- name: Record u-blox F9P firmware flash output
  ansible.builtin.copy:
    dest: "{{ alfred_f9p_state_dir }}/f9p-firmware-flash.txt"
    content: |
      # Generated by alfred-ansible
      # Device: {{ alfred_f9p_device }}
      # Firmware: {{ alfred_f9p_firmware_file }}
      # Dry run: {{ alfred_f9p_flash_dry_run }}
      {{ alfred_f9p_flash_result.stdout | default('') }}
      {{ alfred_f9p_flash_result.stderr | default('') }}
      {{ alfred_f9p_post_flash_probe.stdout | default('') }}
      {{ alfred_f9p_post_flash_probe.stderr | default('') }}
    owner: root
    group: root
    mode: "0644"
  when: alfred_f9p_flash_result is defined
  tags: [never, f9p-flash]
