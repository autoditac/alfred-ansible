---
# Ansible role: alfred
# Configures a Raspberry Pi (or BananaPi) to run Alfred mower services.
#
# Usage:
#   ansible-playbook -i inventory.yml site.yml --limit localhost --connection=local
#
# Tags:
#   packages  - Install system packages
#   security  - Enable unattended security updates and the nightly reboot window on opted-in hosts
#   logging   - Stream-aware journald storage and retention
#   tuning    - CPU governor, sysctl, WiFi, boot config
#   openocd   - Deploy OpenOCD SWD configs
#   services  - Deploy Podman Quadlet service files
#   firmware  - Flash MCU firmware (requires pre-built .bin)
#   gps       - Persist u-blox F9P receiver profile (no firmware flashing)
#   f9p-preflight - Deploy/probe u-blox firmware updater tooling
#   f9p-flash - Explicit u-blox F9P firmware flash; dry-run unless confirmed

- name: Alfred mower setup
  hosts: mowers
  become: true
  roles:
    - alfred
